version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: ai_postgres_db
    restart: always
    env_file:
      - .env  # <--- FIX: This tells DB to use the exact same password as your web/worker!
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: ai_fastapi_web
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./uploads:/app/uploads 
    env_file:
      - .env
    environment:
      # These override .env just for docker internal networking
      - POSTGRES_HOST=db  
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    container_name: ai_celery_worker
    restart: always
    volumes:
      - .:/app
      - ./uploads:/app/uploads 
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: celery -A app.worker.celery_app worker --loglevel=info

  beat:
    build: .
    container_name: ai_celery_beat
    restart: always
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db
    command: celery -A app.worker.celery_app beat --loglevel=info

volumes:
  postgres_data: